
name: Auto Merge Pull Requests

on:
  workflow_run:
    workflows:
      - API integration tests
      - Java unit tests
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Verify both workflows and merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_RUN_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        shell: bash
        run: |
          set -euo pipefail

          PR_NUMBERS=$(jq -r '.[].number' <<< "$EVENT_RUN_PRS")

          if [ -z "$PR_NUMBERS" ]; then
            echo "No associated pull request."
            exit 0
          fi

          for PR in $PR_NUMBERS; do
            echo "Checking PR #$PR"

            PR_JSON=$(gh api "repos/$REPO/pulls/$PR")

            BASE=$(jq -r '.base.ref' <<< "$PR_JSON")
            STATE=$(jq -r '.state' <<< "$PR_JSON")
            DRAFT=$(jq -r '.draft' <<< "$PR_JSON")
            HEAD_SHA=$(jq -r '.head.sha' <<< "$PR_JSON")
            HEAD_BRANCH=$(jq -r '.head.ref' <<< "$PR_JSON")
            HEAD_REPO=$(jq -r '.head.repo.full_name' <<< "$PR_JSON")

            if [ "$BASE" != "main" ] ||
               [ "$STATE" != "open" ] ||
               [ "$DRAFT" != "false" ] ||
               [ "$HEAD_REPO" != "$REPO" ]; then
              echo "PR #$PR is not eligible."
              continue
            fi

            ALL_PASSED=true
            EXPECTED_RUN_SHA=""

            for WORKFLOW in "unit-tests.yml" "tests.yml"; do
              echo "Checking $WORKFLOW"

              RUNS=$(gh api \
                --method GET \
                "repos/$REPO/actions/workflows/$WORKFLOW/runs" \
                -f event=pull_request \
                -f branch="$HEAD_BRANCH" \
                -F per_page=100)

              LATEST=$(jq -c \
                --argjson pr "$PR" \
                --arg sha "$HEAD_SHA" '
                [
                  .workflow_runs[]
                  | select(
                      any(.pull_requests[]?;
                        .number == $pr and .head.sha == $sha
                      )
                    )
                ]
                | sort_by(.created_at, .id)
                | last // empty
              ' <<< "$RUNS")

              if [ -z "$LATEST" ]; then
                echo "No matching run for $WORKFLOW."
                ALL_PASSED=false
                break
              fi

              STATUS=$(jq -r '.status' <<< "$LATEST")
              CONCLUSION=$(jq -r '.conclusion' <<< "$LATEST")
              RUN_SHA=$(jq -r '.head_sha' <<< "$LATEST")

              echo "Status: $STATUS"
              echo "Conclusion: $CONCLUSION"

              if [ "$STATUS" != "completed" ] ||
                 [ "$CONCLUSION" != "success" ]; then
                echo "$WORKFLOW has not passed."
                ALL_PASSED=false
                break
              fi

              if [ -n "$EXPECTED_RUN_SHA" ] &&
                 [ "$RUN_SHA" != "$EXPECTED_RUN_SHA" ]; then
                echo "Workflow runs tested different commits."
                ALL_PASSED=false
                break
              fi

              EXPECTED_RUN_SHA="$RUN_SHA"
            done

            if [ "$ALL_PASSED" != "true" ]; then
              echo "PR #$PR will not be merged."
              continue
            fi

            if [ "$EVENT_RUN_SHA" != "$EXPECTED_RUN_SHA" ]; then
              echo "The triggering run is outdated."
              continue
            fi

            echo "Both required workflows passed."

            LATEST_PR=$(gh api "repos/$REPO/pulls/$PR")
            LATEST_HEAD=$(jq -r '.head.sha' <<< "$LATEST_PR")
            MERGEABLE=$(jq -r '.mergeable' <<< "$LATEST_PR")

            if [ "$LATEST_HEAD" != "$HEAD_SHA" ]; then
              echo "PR was updated during verification."
              continue
            fi

            if [ "$MERGEABLE" != "true" ]; then
              echo "PR is not currently mergeable."
              continue
            fi

            gh pr merge "$PR" \
              --repo "$REPO" \
              --squash \
              --match-head-commit "$HEAD_SHA"

            echo "Merge requested for PR #$PR."
          done
